name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/bot-worker/pnpm-lock.yaml

      - name: Install Worker dependencies
        working-directory: apps/bot-worker
        run: pnpm install --frozen-lockfile

      - name: Test Worker
        working-directory: apps/bot-worker
        run: pnpm test

      - name: Check TypeScript
        working-directory: apps/bot-worker
        run: pnpm typecheck

      - name: Test local tools
        run: node --test tools/backup/*.test.mjs tools/fatsecret-import/*.test.mjs
